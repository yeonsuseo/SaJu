<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크리스마스 케이크 쌓기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;900&display=swap">
<style>
/* Layout: one 9:16 winter-night bakery screen (reels frame) with a control strip below. Single dark theme by choice. */
:root{
  --bg:#0d1424; --panel:#18223a; --line:#2c3a5e; --ink:#fff7ee; --muted:#9aa6c4; --berry:#e8475f; --gold:#ffd166;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Gothic A1",system-ui,sans-serif;margin:0;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:manipulation;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{display:block;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6);cursor:pointer;max-width:100%;-webkit-tap-highlight-color:transparent}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--berry);border-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{color:var(--muted);font-size:12px}
</style>

<canvas id="c" aria-label="케이크 쌓기 게임 화면. 탭하면 층을 내려놓아요"></canvas>
<div class="bar">
  <button class="primary" id="again">새 케이크</button>
  <button id="snd">소리 켜짐</button>
  <span class="hint">화면 탭 또는 스페이스바로 내려놓기</span>
</div>

<script>
const W=360, VH=640, S=3, LH=24, BASE=560, MAXW=230;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
cv.width=W*S; cv.height=VH*S;
function fit(){const bh=document.querySelector('.bar').offsetHeight;const h=Math.min(innerHeight-bh-40,(innerWidth-32)*16/9);cv.style.height=h+'px';cv.style.width=h*9/16+'px'}
addEventListener('resize',fit); fit();

/* layer looks: sponge, cream, jam, sponge, cream, chocolate (repeats) */
const TYPES=[
  {name:'sponge',top:'#f6d59a',side:'#e9b96e'},
  {name:'cream',top:'#fffaf1',side:'#f1e4d0'},
  {name:'jam',top:'#ef5470',side:'#c7344f'},
  {name:'sponge',top:'#f6d59a',side:'#e9b96e'},
  {name:'cream',top:'#fffaf1',side:'#f1e4d0'},
  {name:'choco',top:'#7a4a30',side:'#5c3420'},
];
const SCALE=[523,587,659,784,880,1047,1175,1319,1568,1760,2093];

let best=0; try{best=+localStorage.getItem('cake-best')||0}catch(e){}
let ac=null, soundOn=true;
function tone(f,v=.08,len=.15,type='triangle',slide=0){
  if(!ac||!soundOn) return; const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+len);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+len); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+len+.02);
}

let state, layers, cur, falling, sparks, combo, cam, camT, popups, endT, shake;
const snow=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*VH,r:.6+Math.random()*1.6,v:12+Math.random()*25,ph:Math.random()*6}));
function reset(){
  layers=[{x:(W-200)/2,w:200,t:0}];
  falling=[]; sparks=[]; popups=[]; combo=0; cam=0; camT=0; endT=0; shake=0;
  spawn(); state='title';
}
function spawn(){
  const prev=layers[layers.length-1], n=layers.length, dir=n%2?1:-1;
  const speed=Math.min(330,135+n*7);
  cur={w:prev.w, x:dir>0?-prev.w*.6:W-prev.w*.4, dir, speed, t:n%TYPES.length};
}
const topY=i=>BASE-(i+1)*LH;   // world y of layer i's top edge

function place(){
  const prev=layers[layers.length-1], i=layers.length;
  const left=Math.max(cur.x,prev.x), right=Math.min(cur.x+cur.w,prev.x+prev.w), ov=right-left;
  if(ov<=0){ // missed completely: the whole layer drops and the cake is done
    falling.push({x:cur.x,y:topY(i),w:cur.w,t:cur.t,vx:cur.dir*60,vy:0,rot:0,vr:cur.dir*2});
    tone(300,.15,.5,'sawtooth',-220); state='over'; endT=0; shake=1;
    const score=layers.length-1; if(score>best){best=score;try{localStorage.setItem('cake-best',best)}catch(e){}}
    return;
  }
  if(Math.abs(cur.x-prev.x)<=5){ // perfect: snap, keep the width, grow it after 3 in a row
    combo++;
    let x=prev.x, w=prev.w;
    if(combo>=3&&w<MAXW){const g=Math.min(10,MAXW-w);x-=g/2;w+=g}
    layers.push({x,w,t:cur.t});
    tone(SCALE[Math.min(combo-1,SCALE.length-1)],.12,.25,'triangle');
    if(combo>=3) tone(SCALE[Math.min(combo+1,SCALE.length-1)]*2,.05,.3,'sine');
    for(let k=0;k<18;k++){const a=k/18*Math.PI*2;sparks.push({x:x+w/2+Math.cos(a)*w*.5,y:topY(i)+LH/2,vx:Math.cos(a)*90,vy:Math.sin(a)*60-30,l:.7})}
    popups.push({text:combo>=2?`PERFECT ×${combo}`:'PERFECT',y:topY(i)-14,l:1});
  }else{
    combo=0;
    const cutL=cur.x<prev.x, cw=cur.w-ov, cx=cutL?cur.x:right;
    falling.push({x:cx,y:topY(i),w:cw,t:cur.t,vx:(cutL?-1:1)*70,vy:-40,rot:0,vr:(cutL?-1:1)*3});
    layers.push({x:left,w:ov,t:cur.t});
    tone(200+Math.min(ov,200),.12,.12,'square',-80);
  }
  spawn();
}
function tap(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(state==='title'){state='play';return}
  if(state==='play') return place();
  if(state==='over'&&endT>.8){reset();state='play'}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tap()}});
document.getElementById('again').onclick=()=>{reset();state='play'};
document.getElementById('snd').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'소리 켜짐':'소리 꺼짐'};

/* ---------- drawing ---------- */
const FD='"Black Han Sans","Gothic A1",sans-serif', FB='"Gothic A1",system-ui,sans-serif';
function txt(t,x,y,size,col,font=FD,stroke=0,weight=''){ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='rgba(10,14,30,.85)';ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=col;ctx.fillText(t,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}
function drawLayer(x,y,w,t,idx){
  const T=TYPES[t]; if(w<=0) return;
  rr(x,y,w,LH,5); ctx.fillStyle=T.side; ctx.fill();
  rr(x,y,w,LH*.45,5); ctx.fillStyle=T.top; ctx.fill();
  if(T.name==='cream'){ctx.fillStyle=T.top;for(let dx=6;dx<w-4;dx+=13){ctx.beginPath();ctx.arc(x+dx,y+LH*.62,4.2,0,7);ctx.fill()}}
  if(T.name==='sponge'){ctx.fillStyle='rgba(160,105,40,.35)';for(let k=0;k<w/14;k++){const px=x+6+((k*37+idx*11)%Math.max(1,w-12)),py=y+LH*.55+((k*13+idx*7)%8);ctx.beginPath();ctx.arc(px,py,1.3,0,7);ctx.fill()}}
  if(T.name==='jam'){ctx.fillStyle='rgba(255,255,255,.35)';rr(x+4,y+3,Math.max(0,w-8),2.5,2);ctx.fill()}
  if(T.name==='choco'){ctx.fillStyle='rgba(255,220,190,.18)';for(let dx=8;dx<w-6;dx+=18){rr(x+dx,y+4,8,2,1);ctx.fill()}}
}
function drawTopper(L,y,k){ // strawberries + candle on the finished cake
  const cx=L.x+L.w/2, n=Math.max(1,Math.min(4,Math.floor(L.w/40)));
  for(let s=0;s<n;s++){const sx=L.x+(s+.5)*L.w/n, sy=y-6*k;
    ctx.fillStyle='#e8344f';ctx.beginPath();ctx.moveTo(sx-7,sy-2);ctx.quadraticCurveTo(sx,sy+12,sx+7,sy-2);ctx.quadraticCurveTo(sx,sy-8,sx-7,sy-2);ctx.fill();
    ctx.fillStyle='#3fa34d';ctx.beginPath();ctx.ellipse(sx,sy-5,5,2.2,0,0,7);ctx.fill()}
  ctx.fillStyle='#fff';rr(cx-3,y-34*k,6,26*k,2);ctx.fill();ctx.fillStyle='#e8475f';for(let s=0;s<3;s++){ctx.fillRect(cx-3,y-30*k+s*8*k,6,3*k)}
  if(k>=1){const fl=Math.sin(performance.now()/90)*1.2;const g=ctx.createRadialGradient(cx,y-40,1,cx,y-40,22);g.addColorStop(0,'rgba(255,210,100,.55)');g.addColorStop(1,'rgba(255,210,100,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,y-40,22,0,7);ctx.fill();
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.ellipse(cx+fl*.3,y-40,3.2,6+fl,0,0,7);ctx.fill()}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state==='play'){cur.x+=cur.dir*cur.speed*dt; const lo=-cur.w*.75, hi=W-cur.w*.25; if(cur.x<lo){cur.x=lo;cur.dir=1} if(cur.x>hi){cur.x=hi;cur.dir=-1}}
  if(state==='over') endT+=dt;
  for(const f of falling){f.vy+=1400*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt}
  falling=falling.filter(f=>f.y<BASE+VH);
  for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt} sparks=sparks.filter(s=>s.l>0);
  for(const p of popups){p.y-=30*dt;p.l-=dt*1.1} popups=popups.filter(p=>p.l>0);
  // camera keeps the newest layer around the upper third; on game over it pulls back to show the whole cake
  const h=layers.length*LH;
  if(state!=='over'){camT=Math.max(0,h-330);cam+=(camT-cam)*Math.min(1,dt*6)}
  const zk=state==='over'?1-Math.pow(1-Math.min(1,endT/1.2),3):0, zoom=Math.min(1,Math.max(.3,(VH*.5)/(h+60))), Z=1+(zoom-1)*zk;
  shake*=.9;

  ctx.setTransform(S,0,0,S,0,0);
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#101a35');g.addColorStop(.7,'#1d2850');g.addColorStop(1,'#2b2346');ctx.fillStyle=g;ctx.fillRect(0,0,W,VH);
  // string lights
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x+=4)ctx.lineTo(x,22+Math.sin(x/W*Math.PI*3)*8);ctx.stroke();
  for(let k=0;k<14;k++){const x=12+k*25.5,y=22+Math.sin(x/W*Math.PI*3)*8+5,on=(Math.floor(now/400)+k)%3!==0;ctx.fillStyle=['#ff5a6e','#ffd166','#7ee081','#6ec8ff'][k%4];ctx.globalAlpha=on?1:.35;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}ctx.globalAlpha=1;
  for(const f of snow){f.y+=f.v*dt;f.x+=Math.sin(now/1000+f.ph)*.15;if(f.y>VH){f.y=-4;f.x=Math.random()*W}ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}

  // world: zoom around the plate on game over
  const sx=(Math.random()-.5)*shake*6;
  // the plate rises from y 590 to 520 so the finished cake clears the bottom message
  const AY=BASE+30, anchor=AY-70*zk;
  ctx.setTransform(S*Z,0,0,S*Z,S*(W/2*(1-Z)+sx),S*(anchor-AY*Z));
  ctx.translate(0,cam*(1-zk));
  // plate
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(W/2,BASE+14,150,10,0,0,7);ctx.fill();
  ctx.fillStyle='#e9edf6';rr(W/2-140,BASE,280,9,5);ctx.fill();ctx.fillStyle='#c5cbe0';rr(W/2-110,BASE+9,220,6,3);ctx.fill();
  layers.forEach((L,i)=>drawLayer(L.x,topY(i),L.w,L.t,i));
  if(state==='play') drawLayer(cur.x,topY(layers.length),cur.w,cur.t,layers.length);
  if(state==='over'){const L=layers[layers.length-1];drawTopper(L,topY(layers.length-1),Math.min(1,endT/.6))}
  for(const f of falling){ctx.save();ctx.translate(f.x+f.w/2,f.y+LH/2);ctx.rotate(f.rot);drawLayer(-f.w/2,-LH/2,f.w,f.t,0);ctx.restore()}
  for(const s of sparks){ctx.globalAlpha=Math.max(0,s.l/.7);ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(s.x,s.y,1.8,0,7);ctx.fill()}ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=Math.min(1,p.l*2);txt(p.text,W/2,p.y,18,'#ffd166',FD,4)}ctx.globalAlpha=1;

  // HUD
  ctx.setTransform(S,0,0,S,0,0);
  const score=layers.length-1;
  if(state==='play'){txt(score+'',W/2,92,64,'#fff',FD,6);txt('층',W/2,130,14,'#c9d2ee',FB,3,'900');txt('최고 '+best+'층',W-46,52,11,'#9aa6c4',FB,3,'700')}
  if(state==='title'){
    txt('크리스마스',W/2,150,20,'#ffd166',FB,4,'900');
    txt('케이크 쌓기',W/2,196,48,'#fff',FD,6);
    txt('몇 층까지 쌓을 수 있을까?',W/2,240,15,'#e6ebff',FB,4,'700');
    ctx.globalAlpha=.6+.4*Math.sin(now/250);txt('탭해서 시작',W/2,300,16,'#fff',FB,4,'900');ctx.globalAlpha=1;
    txt('딱 맞추면 PERFECT · 3번 연속이면 케이크가 커져요',W/2,612,10,'#9aa6c4',FB,3,'700');
  }
  if(state==='over'){
    const a=Math.min(1,Math.max(0,(endT-.9)/.4));ctx.globalAlpha=a;
    const title=score<10?'초보 파티시에':score<20?'동네 빵집 사장님':score<30?'호텔 파티시에':'케이크 장인';
    txt(score+'층 케이크 완성!',W/2,92,36,'#fff',FD,6);
    txt(title,W/2,132,16,'#ffd166',FB,4,'900');
    txt(score>=best&&score>0?'최고 기록!':'최고 '+best+'층',W/2,156,12,'#c9d2ee',FB,3,'700');
    ctx.fillStyle='rgba(13,20,36,.8)';rr(40,566,W-80,52,26);ctx.fill();
    txt('친구한테 보내서 대결해 보세요',W/2,584,13,'#fff',FB,3,'900');
    txt('탭하면 다시 쌓기',W/2,602,10,'#9aa6c4',FB,0,'700');
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>

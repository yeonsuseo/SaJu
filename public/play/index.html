<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낭만 게임 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;900&display=swap">
<style>
:root{--bg:#0d1424;--card:#18223a;--line:#2c3a5e;--ink:#fff7ee;--muted:#9aa6c4;--gold:#ffd166;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1",system-ui,sans-serif;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Black Han Sans","Gothic A1",sans-serif;font-weight:400;font-size:34px;margin:0}
p.sub{color:var(--muted);margin:0 0 8px;font-weight:700}
a.game{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none}
a.game:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{font-size:34px;width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:#0d1424;flex:none}
.name{font-weight:900;font-size:18px}.desc{color:var(--muted);font-size:13px;margin-top:4px;font-weight:700}
.go{margin-left:auto;color:var(--gold);font-weight:900;flex:none}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
</style></head><body><main>
<h1>낭만 게임 모음</h1>
<p class="sub">릴스에 나온 게임, 여기서 바로 해보세요</p>
<a class="game" href="cake/"><span class="ico">🎂</span><span><div class="name">크리스마스 케이크 쌓기</div><div class="desc">타이밍 맞춰 탭! 몇 층까지 쌓을까?</div></span><span class="go">플레이</span></a>
<a class="game" href="marble/"><span class="ico">🏁</span><span><div class="name">국가대표 마블 레이스</div><div class="desc">국기 구슬 12개, 누가 1등할까?</div></span><span class="go">플레이</span></a>
<footer>@nangmanisall</footer>
</main></body></html>
